<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140927" />
      <stop offset="50%" stop-color="#0E051D" />
      <stop offset="100%" stop-color="#080312" />
    </linearGradient>

    <!-- Glowing Purple Gradients -->
    <linearGradient id="needleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#A855F7" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>

    <linearGradient id="arcGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>

    <!-- Filters for Intense Glow Effect -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softPurple" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Rounded App Icon Container -->
  <rect width="500" height="500" rx="105" fill="url(#bg)" />

  <!-- Ambient Glow Center -->
  <circle cx="250" cy="210" r="130" fill="#9333EA" opacity="0.25" filter="url(#softPurple)" />
  <circle cx="250" cy="210" r="70" fill="#C084FC" opacity="0.3" filter="url(#softPurple)" />

  <!-- Outer Crosshair Ticks -->
  <line x1="250" y1="55" x2="250" y2="85" stroke="#9333EA" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <line x1="250" y1="335" x2="250" y2="365" stroke="#9333EA" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <line x1="95" y1="210" x2="125" y2="210" stroke="#9333EA" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <line x1="375" y1="210" x2="405" y2="210" stroke="#9333EA" stroke-width="3" stroke-linecap="round" opacity="0.8" />

  <!-- Outermost Dashed Radar Orbit -->
  <circle cx="250" cy="210" r="142" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="3 6" opacity="0.5" />

  <!-- Main Outer Solid Ring -->
  <circle cx="250" cy="210" r="128" fill="none" stroke="#9333EA" stroke-width="3.5" opacity="0.75" />

  <!-- Curved Accent Arcs -->
  <!-- Top Arc -->
  <path d="M 185 105 A 130 130 0 0 1 315 105" fill="none" stroke="url(#arcGlow)" stroke-width="5.5" stroke-linecap="round" filter="url(#glow)" />
  <!-- Bottom Arc -->
  <path d="M 315 315 A 130 130 0 0 1 185 315" fill="none" stroke="url(#arcGlow)" stroke-width="5.5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Concentric Middle Ring -->
  <circle cx="250" cy="210" r="98" fill="none" stroke="#A855F7" stroke-width="14" opacity="0.35" />
  <circle cx="250" cy="210" r="98" fill="none" stroke="#E9D5FF" stroke-width="2.5" opacity="0.7" />

  <!-- Inner Dotted Ring Track -->
  <circle cx="250" cy="210" r="76" fill="none" stroke="#C084FC" stroke-width="2" stroke-dasharray="4 6" opacity="0.6" />

  <!-- Inner Solid Ring with Glow -->
  <circle cx="250" cy="210" r="54" fill="none" stroke="#C084FC" stroke-width="5" filter="url(#glow)" />

  <!-- Glowing Compass Needle (Diagonal Angle ~45 deg) -->
  <!-- Top-Right Blade -->
  <polygon points="250,210 240,200 345,105 260,220" fill="url(#needleGrad)" filter="url(#glow)" />
  <!-- Bottom-Left Blade -->
  <polygon points="250,210 260,220 155,315 240,200" fill="url(#needleGrad)" filter="url(#glow)" />
  <!-- Highlight Needle Spine -->
  <line x1="155" y1="315" x2="345" y2="105" stroke="#FFFFFF" stroke-width="1.5" opacity="0.85" />

  <!-- Connected Sub-Nodes & Circuit Indicators -->
  <!-- Upper Left Node -->
  <line x1="185" y1="145" x2="235" y2="195" stroke="#C084FC" stroke-width="1.5" opacity="0.7" />
  <circle cx="185" cy="145" r="5" fill="#FFFFFF" filter="url(#nodeGlow)" />
  
  <!-- Lower Right Node -->
  <line x1="315" y1="275" x2="335" y2="295" stroke="#C084FC" stroke-width="1.5" opacity="0.7" />
  <circle cx="335" cy="295" r="5" fill="#FFFFFF" filter="url(#nodeGlow)" />

  <!-- Tip Nodes (Glowing White Pearls) -->
  <circle cx="345" cy="105" r="6.5" fill="#FFFFFF" filter="url(#nodeGlow)" />
  <circle cx="155" cy="315" r="6.5" fill="#FFFFFF" filter="url(#nodeGlow)" />

  <!-- Center Core Ring & Bullseye -->
  <circle cx="250" cy="210" r="24" fill="#0C0517" stroke="#A855F7" stroke-width="4.5" filter="url(#glow)" />
  <circle cx="250" cy="210" r="10" fill="#FFFFFF" filter="url(#nodeGlow)" />

  <!-- Typography: OpenFinder -->
  <text x="250" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif" font-size="36" font-weight="800" text-anchor="middle" fill="#FFFFFF" filter="url(#glow)">
    OpenFinder
  </text>

  <!-- Subtitle: AI CAREER SCOUT -->
  <text x="250" y="448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="6" text-anchor="middle" fill="#C084FC" opacity="0.9">
    AI CAREER SCOUT
  </text>
</svg>