<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <style>
      .brand-title {
        fill: #0F172A;
      }
      .tagline-text {
        fill: #64748B;
      }
      .badge-bg {
        fill: #0284C7;
        fill-opacity: 0.08;
        stroke: #0284C7;
      }
      .badge-text {
        fill: #0284C7;
      }
      @media (prefers-color-scheme: dark) {
        .brand-title {
          fill: #F8FAFC;
        }
        .tagline-text {
          fill: #94A3B8;
        }
        .badge-bg {
          fill: #38BDF8;
          fill-opacity: 0.15;
          stroke: #38BDF8;
        }
        .badge-text {
          fill: #38BDF8;
        }
      }
    </style>

    <!-- Vibrant Modern Blue Gradient -->
    <linearGradient id="rocketBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0A66C2"/>
    </linearGradient>

    <!-- Warm Thrust Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <!-- Text Highlight Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- ROCKET LAUNCH ICON (Firing Upwards) -->
  <g transform="translate(30, 0)">
    <!-- Exhaust Thrust Flames -->
    <!-- Outer Flame -->
    <path d="M 40 76 Q 40 104 36 112 Q 40 102 44 112 Q 40 104 40 76 Z" fill="url(#flameGrad)" opacity="0.95"/>
    <!-- Inner Core Flame -->
    <path d="M 40 76 Q 40 94 38 100 Q 40 92 42 100 Q 40 94 40 76 Z" fill="#FDE047"/>
    <!-- Propulsion Speed Particles -->
    <circle cx="34" cy="106" r="2" fill="#F59E0B" opacity="0.6"/>
    <circle cx="46" cy="108" r="1.8" fill="#F59E0B" opacity="0.6"/>
    <circle cx="40" cy="115" r="1.2" fill="#EF4444" opacity="0.5"/>

    <!-- Left Rocket Fin -->
    <path d="M 28 58 L 14 74 Q 22 76 28 68 Z" fill="url(#rocketBlue)"/>
    <!-- Right Rocket Fin -->
    <path d="M 52 58 L 66 74 Q 58 76 52 68 Z" fill="url(#rocketBlue)"/>

    <!-- Rocket Body (Sleek Aerodynamic Cone) -->
    <path d="M 40 12 C 26 34 24 60 28 76 L 52 76 C 56 60 54 34 40 12 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Rocket Nosecone Tip -->
    <path d="M 40 12 C 33 24 31 34 31 38 L 49 38 C 49 34 47 24 40 12 Z" fill="url(#rocketBlue)"/>

    <!-- Rocket Porthole Window -->
    <circle cx="40" cy="50" r="6" fill="#0F172A" stroke="url(#rocketBlue)" stroke-width="2"/>
    <circle cx="40" cy="50" r="3.2" fill="#38BDF8"/>
    <!-- Window Glint -->
    <circle cx="38.5" cy="48.5" r="0.9" fill="#FFFFFF"/>

    <!-- Speed Sparks -->
    <path d="M 18 32 L 22 30" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
    <path d="M 62 32 L 58 30" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
    <circle cx="16" cy="22" r="1.4" fill="#38BDF8" opacity="0.8"/>
    <circle cx="64" cy="22" r="1.4" fill="#38BDF8" opacity="0.8"/>
  </g>

  <!-- BRAND TYPOGRAPHY & BADGES -->
  <g transform="translate(125, 12)">
    <!-- Main Title: OpenFinder -->
    <text x="0" y="52" class="brand-title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">
      Open<tspan fill="url(#textGrad)">Finder</tspan>
    </text>

    <!-- Sleek Minimalist MCP 2.0 Pill Badge -->
    <rect x="272" y="20" width="76" height="24" rx="12" class="badge-bg" stroke-width="1.2"/>
    <text x="310" y="36.5" class="badge-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">MCP 2.0</text>

    <!-- Subtitle: UNIVERSAL JOB CONNECTOR -->
    <text x="2" y="78" class="tagline-text" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">
      UNIVERSAL JOB CONNECTOR
    </text>
  </g>
</svg>