<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" width="100%" height="100%">
  <defs>
    <!-- Subtle linear gradient for modern soft look -->
    <linearGradient id="finderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A66C2"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0A66C2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Logo Mark Container -->
  <g transform="translate(30, 25)">
    <!-- Rounded Squircle Badge -->
    <rect x="0" y="0" width="130" height="130" rx="32" fill="#0F172A" filter="url(#softShadow)"/>
    <rect x="1" y="1" width="128" height="128" rx="31" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

    <!-- Minimal Viewfinder Aperture (Scout / Target) -->
    <!-- Top-Left Corner -->
    <path d="M38 52 V42 H48" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Top-Right Corner -->
    <path d="M82 42 H92 V52" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom-Left Corner -->
    <path d="M38 78 V88 H48" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom-Right Corner -->
    <path d="M82 88 H92 V78" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Center Radar Pulse / Finder Circle -->
    <circle cx="65" cy="65" r="15" fill="none" stroke="url(#finderGradient)" stroke-width="3"/>
    <circle cx="65" cy="65" r="5" fill="url(#finderGradient)"/>

    <!-- Dynamic Discovery Spark -->
    <circle cx="86" cy="44" r="3.5" fill="#38BDF8"/>
  </g>

  <!-- Typography / Brand Name -->
  <g transform="translate(185, 30)">
    <!-- Main Title: OpenFinder -->
    <text x="0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#0F172A" letter-spacing="-1">
      Open<tspan fill="url(#finderGradient)">Finder</tspan>
    </text>

    <!-- Clean Badge Tag: MCP v2.0 -->
    <rect x="290" y="24" width="76" height="24" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="328" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0A66C2" text-anchor="middle" letter-spacing="0.5">MCP 2.0</text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#64748B" letter-spacing="1.8">
      AI LINKEDIN SCOUT &amp; ATS MATCHER
    </text>
  </g>
</svg>